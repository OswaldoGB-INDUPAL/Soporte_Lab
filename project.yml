name: SoporteLab
options:
  bundleIdPrefix: sv.edu.utec
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SoporteLab:
    type: application
    platform: iOS
    sources: [SoporteLab]
    info:
      path: SoporteLab/Info.plist
      properties:
        CFBundleDisplayName: SoporteLab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sv.edu.utec.SoporteLab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  SoporteLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SoporteLabTests]
    dependencies:
      - target: SoporteLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SoporteLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SoporteLabUITests]
    dependencies:
      - target: SoporteLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SoporteLab:
    build:
      targets:
        SoporteLab: all
        SoporteLabTests: [test]
        SoporteLabUITests: [test]
    test:
      targets: [SoporteLabTests, SoporteLabUITests]
